name: Bug Report
description: Create a report to help us improve CookedDisk
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: input
    id: obs-version
    attributes:
      label: OBS Studio Version
      placeholder: e.g. 33.0.1 (64-bit)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Windows OS Build
      placeholder: e.g. Windows 11 Pro 23H2 (Build 22631)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Start OBS Studio recording
        2. Launch CookedDisk
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: CookedDisk Diagnostics / Logs
      description: Paste lines from the "Copy diagnostics" button in CookedDisk.
      render: shell
